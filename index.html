<html lang="en" dir="ltr">

<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1d2733;--mut:#6b7785;--pri:#0f6cbd;--bd:#dde3ea;--bad:#c62828}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
header{background:var(--pri);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1}
header button{background:#ffffff26;border:0;color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer}
nav{display:flex;gap:4px;padding:8px 10px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;font-size:14px;color:var(--mut)}
nav button.on{background:var(--pri);color:#fff}
main{padding:6px;max-width:none;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:8px}
.card h3{margin:0 0 8px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
input,select{font:inherit;padding:7px 8px;border:1px solid var(--bd);border-radius:6px;background:#fff;max-width:100%}
input[type=color]{padding:0;width:36px;height:30px}
button.b{background:var(--pri);color:#fff;border:0;padding:8px 14px;border-radius:7px;cursor:pointer;font:inherit}
button.b.sec{background:#e9eef4;color:var(--tx)}
button.b.red{background:var(--bad)}
button.b.grn{background:#2e7d32}
button.b.sm{padding:3px 9px;font-size:12px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--bd);padding:5px 7px;text-align:center}
th{background:#eef2f6;font-weight:600}
td.l,th.l{text-align:left}
.tw{overflow-x:auto}
/* monthly sheet: dates down the left, workers across the top, fits the screen */
.gw{overflow-x:auto;border:1px solid var(--bd);border-radius:8px}
table.g{table-layout:fixed;width:100%}
table.g th,table.g td{padding:1px 0;overflow:hidden;line-height:1.5}
table.g th.dcol,table.g td.dcol{width:50px;text-align:left;padding:1px 4px;position:sticky;left:0;background:#fff;z-index:2;white-space:nowrap}
table.g td.dcol.pr{background:#fde7c8}
table.g td.dcol.ph{background:#e8e1f5}
table.g th.oc,table.g td.oc{width:20px;background:#f8fafc}

table.g th.wn span{line-height:1.05;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;display:inline-block;max-height:98px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
table.g tr.tt td{background:#f8fafc;font-weight:700}
table.g tr.tt td.dcol{background:#eef2f6}
td.N{background:#fff}
.wk{display:grid;grid-template-columns:minmax(120px,170px) 1fr minmax(150px,270px) 72px 76px;gap:6px;align-items:center;padding:4px 6px;border:1px solid var(--bd);border-left:6px solid var(--c,#ccc);border-radius:8px;margin-bottom:4px;background:#fff}
.wk.wkh{border:0;font-weight:600;color:var(--mut);margin-bottom:0}
.wk input.nm{width:100%;font-weight:600}
.wk.inact{opacity:.45}
.rc{border:1px solid var(--bd);border-left:6px solid var(--c);border-radius:8px;padding:6px 8px;margin-bottom:6px}
.rr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0}
.rr label{display:flex;gap:5px;align-items:center;font-size:13px}
.rr .lb{font-size:12px;color:var(--mut)}
@media(max-width:820px){.wk{grid-template-columns:1fr 1fr}.wk .ty,.wk .sf{grid-column:1/-1}.wk.wkh{display:none}}
.dt{border:1px solid var(--bd);background:#fff;border-radius:5px;padding:3px 0;width:25px;font-size:10px;cursor:pointer}
.dt.on{background:var(--pri);color:#fff;border-color:var(--pri)}
th.pr{background:#fde7c8!important}
td.c{cursor:pointer;font-weight:700}
td.W{background:#e6f6ec;color:#7aa88a}td.L{background:#fff2cc;color:#8a6d00}td.A{background:#fbd5d5;color:#a32020}td.P{background:#fde2cf;color:#a8460b}td.H{background:#d9e8fb;color:#1f5da8}td.F{background:#e8e1f5;color:#5a3d99}
td.pl{outline:2px dashed #e08a00;outline-offset:-2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.k{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}
.k b{display:block;font-size:22px}
.k span{color:var(--mut);font-size:12px}
.warn{background:#fff4e5;border:1px solid #ffd59a;border-radius:8px;padding:8px;margin:6px 0;font-size:13px}
.bad{background:#fdeaea;border-color:#f3b4b4}
.good{background:#e8f6ed;border-color:#b5e0c3}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;margin:1px;color:#fff}
.tag.n{background:#eef2f6;color:var(--tx)}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
.md{background:#fff;border-radius:12px;padding:16px;width:480px;max-width:100%;max-height:90vh;overflow:auto}
.md h3{margin-top:0}
.fl{display:grid;gap:10px}
.fl>label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.chip.sel{background:var(--c,#555);color:#fff}
.sh{padding-top:6px;margin:10px 0 4px;font-weight:700;color:var(--mut)}
.wr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--bd);border-left:6px solid var(--c);border-radius:8px;padding:7px 9px;margin-bottom:5px}
.wr .nm{flex:1;min-width:140px;font-weight:600}
.wr .nm small{display:block;font-weight:400;color:var(--mut)}
.dvt{flex-basis:100%;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-left:30px;font-size:13px}.dvt input[type=time]{width:96px}.dvg{display:flex;gap:4px;align-items:center}.dvt .chip{padding:5px 9px}
.sbt{display:flex;gap:4px;flex-wrap:wrap}
.sbt button{border:1.5px solid var(--bd);background:#fff;border-radius:7px;padding:7px 10px;cursor:pointer;font:inherit;font-size:13px;color:var(--tx)}
.sbt button.on{color:#fff;font-weight:700;border-color:transparent}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.leg{color:var(--mut);font-size:12px;margin-top:6px}
table.wt th,table.wt td{padding:3px 5px}
table.wt td.l{white-space:nowrap}
table.wt input{min-width:130px;border:1px solid transparent;background:transparent;padding:5px;font-weight:600}
table.wt input[type=number]{min-width:0;border-color:var(--bd);font-weight:400}
table.wt input:focus{border-color:var(--pri);background:#fff}
table.wt tr.inact{opacity:.45}
.chips.s{gap:4px;flex-wrap:wrap}
.chips.s .chip{padding:3px 10px;font-size:12px;border-width:1.5px;white-space:nowrap}
.wr .ck{width:22px;height:22px;flex:none}
.wr.sel{background:#eaf3fc}
.selbar{position:sticky;top:46px;z-index:4;background:#fff7e0;border:1px solid #ffd59a;border-radius:8px;padding:6px 8px;margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.selbar button{border:0;color:#fff;border-radius:7px;padding:7px 11px;cursor:pointer;font:inherit;font-size:13px;font-weight:600}
td.c{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
td.mv{outline:3px solid #e11d48!important;outline-offset:-3px}
#login{max-width:340px;margin:12vh auto;padding:20px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;z-index:99}
@media print{header,nav,.noprint{display:none!important}body{background:#fff}.card{border:0}}
.dr{display:grid;grid-template-columns:minmax(0,1fr) 86px 86px 30px 36px 52px;gap:3px;align-items:center;padding:3px 4px;background:#fff;border:1px solid var(--bd);border-left:5px solid var(--c,#ccc);border-radius:6px;margin-bottom:2px}
.dr.dh0{background:none;border-color:transparent;border-left-color:transparent;color:var(--mut);font-size:11px;text-align:center;margin-bottom:0}
.dr .dn{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr.dh0 .dn{text-align:left;font-weight:600}
.dr input[type=time]{width:100%;padding:3px 2px;font-size:12.5px}
.dr input[type=time]::-webkit-calendar-picker-indicator{display:none}
.dr .tn{border:1px dashed #94a3b8;background:#f8fafc;border-radius:6px;padding:5px 2px;font:inherit;font-size:12px;color:var(--pri);cursor:pointer}
.dr .od{border:1.5px solid var(--bd);background:#fff;border-radius:6px;padding:3px 0;cursor:pointer;font-size:14px}
.dr .od.on{background:#fed7aa;border-color:#ea580c}
.dr .dh{text-align:center;font-size:13px}
.dr .ss{padding:3px 1px;font-size:12px;width:100%}
.dr .sW{background:#e6f6ec}.dr .sL{background:#fff2cc}.dr .sA{background:#fbd5d5}.dr .sP{background:#fde2cf}.dr .sH{background:#d9e8fb}.dr .sF{background:#e8e1f5}
.dsum{text-align:right;font-size:13px;padding:2px 6px}
/* tighter pages */
main{padding:4px!important}.card{padding:6px!important;margin-bottom:6px!important}.card h3{margin:0 0 5px!important}
.row{gap:5px!important;margin-bottom:5px!important}header{padding:6px 10px!important}nav{padding:3px 6px!important}nav button{padding:6px 10px!important}
.cards{gap:5px!important;margin-bottom:6px!important}.k{padding:5px!important}.k b{font-size:18px!important}
.wr{padding:4px 7px!important;margin-bottom:3px!important;gap:5px!important}.sbt button{padding:5px 8px!important}.sh{margin:6px 0 2px!important;padding-top:2px!important}
input,select{padding:5px 7px}button.b{padding:6px 11px}.leg{margin-top:4px}.warn{padding:6px!important;margin:4px 0!important}
.wk2{display:grid;grid-template-columns:minmax(0,1fr) 124px 56px;gap:3px 4px;align-items:center;padding:3px 4px;border:1px solid var(--bd);border-left:5px solid var(--c,#ccc);border-radius:6px;margin-bottom:3px;background:#fff}
.wk2.inact{opacity:.45}.wk2 .nm{width:100%;font-weight:600;padding:4px 6px}.wk2 select,.wk2 input{padding:4px 5px;font-size:13px;width:100%}
.wk2 .sf2{grid-column:1/3}.wk2 .bt2{display:flex;gap:3px;justify-content:flex-end}.wk2 .bt2 .b{padding:3px 8px}
.dc{background:#fff;border:1px solid var(--bd);border-left:5px solid var(--c,#ccc);border-radius:8px;padding:4px 6px;margin-bottom:3px}
.dc1{display:flex;align-items:center;gap:6px}.dc1 .dnm{flex:1;font-size:15px;min-width:0}.dc1 .dh{font-size:14px;color:#1d4ed8}.dc1 .ss{width:96px;padding:3px 2px;font-size:12px}
.dc1 .sW{background:#e6f6ec}.dc1 .sL{background:#fff2cc}.dc1 .sA{background:#fbd5d5}.dc1 .sP{background:#fde2cf}.dc1 .sH{background:#d9e8fb}.dc1 .sF{background:#e8e1f5}
.dc2{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:11px;color:var(--mut)}
.dc2 input[type=time]{width:84px;padding:3px 2px;font-size:13px}.dc2 input[type=time]::-webkit-calendar-picker-indicator{display:none}
.dc2 .tn{width:84px;border:1px dashed #94a3b8;background:#f8fafc;border-radius:6px;padding:5px 2px;font:inherit;font-size:12.5px;color:var(--pri);cursor:pointer}
.dc2 .od{margin-left:auto;border:1.5px solid var(--bd);background:#fff;border-radius:6px;padding:4px 8px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--tx)}.dc2 .od.on{background:#fed7aa;border-color:#ea580c;font-weight:700}
.cards.one{display:grid!important;grid-template-columns:repeat(7,1fr)!important;gap:3px!important;margin-bottom:5px!important}
.cards.one .k{padding:3px 0!important;border-radius:7px}.cards.one .k b{font-size:16px!important;line-height:1.1}.cards.one .k span{font-size:9.5px;white-space:nowrap}
.fl{gap:5px!important}.fl>label{gap:2px!important}.rc{padding:4px 6px!important;margin-bottom:4px!important}.rr{margin:2px 0!important;gap:6px!important}
.card table:not(.g) th,.card table:not(.g) td{padding:3px 5px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='iat_att_v2';
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const ST={
 N:{l:'Not marked',c:'',col:'#9aa5b1'},
 W:{l:'Present',c:'✓',col:'#2e7d32'},
 L:{l:'Late',c:'L',col:'#c79100'},
 A:{l:'Absent',c:'A',col:'#c62828'},
 P:{l:'Approved',c:'AP',col:'#d2691e'},
 H:{l:'Day off',c:'OFF',col:'#1f6fd0'},
 F:{l:'Public holiday',c:'PH',col:'#6a4bb5'}
};
const PICK=['W','L','A','P','H'];
const DEF={
 shifts:[{id:'A',name:'Morning 8:30',start:'08:30',group:'day'},{id:'B',name:'Morning 10:00',start:'10:00',group:'day'},{id:'C',name:'Night 8:30 PM',start:'20:30',group:'night'},{id:'D',name:'Night 10:00 PM',start:'22:00',group:'night'}],
 roles:[
  {id:'sup',name:'Supervisor',color:'#7c3aed',maxOff:1,perGroup:true,prefDay:[1,2,3],prefNight:[5],strict:true},
  {id:'cutter',name:'Cutter',color:'#be185d',maxOff:0,perGroup:false,prefDay:[],prefNight:[],strict:false},
  {id:'tender',name:'Tender',color:'#ea580c',maxOff:1,perGroup:false,prefDay:[1,2,3],prefNight:[1,2,3],strict:true},
  {id:'clean',name:'Cleaner',color:'#0891b2',maxOff:1,perGroup:false,prefDay:[],prefNight:[],strict:false},
  {id:'worker',name:'Worker',color:'#2563eb',maxOff:0,perGroup:false,prefDay:[],prefNight:[],strict:false},
  {id:'driver',name:'Driver',color:'#16a34a',maxOff:0,perGroup:false,prefDay:[],prefNight:[],strict:false,sep:true}],
 pressureDays:[4,5,6,0],
 quota:2,maxOffPerGroup:0,maxOffDay:0,minGap:7,orderHrs:1,
 lateFee:10,absentDays:2,approvedDays:1,
 users:[{id:'u1',name:'Manager',pin:'1234',role:'admin'}],
 workers:[],att:{},pub:{}
};
const clone=o=>JSON.parse(JSON.stringify(o));
function fixRoles(D){
 if(!D.migDrv){
  D.roles.forEach(r=>{if(/driver/i.test(r.name))r.sep=true});
  if(!D.roles.some(r=>r.sep))D.roles.push(clone(DEF.roles.find(r=>r.id==='driver')));
  D.migDrv=1;
 }
 D.roles.forEach(r=>{if(r.sep===undefined)r.sep=(r.id==='driver')});
}
let DB=load();
(function migrate(){
 const RD={sup:{prefDay:[1,2,3],prefNight:[5],strict:true},tender:{prefDay:[1,2,3],prefNight:[1,2,3],strict:true}};
 if(!DB.roles.some(r=>r.id==='cutter'))DB.roles.splice(1,0,clone(DEF.roles.find(r=>r.id==='cutter')));
 DB.roles.forEach(r=>{if(r.prefDay===undefined){const d=RD[r.id]||{};r.prefDay=d.prefDay||[];r.prefNight=d.prefNight||[];r.strict=!!d.strict}delete r.noPressure});
 fixRoles(DB);
})();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)return Object.assign(clone(DEF),x)}catch(e){}return clone(DEF)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
const todayS=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let me=null,tab='today',selDate=todayS(),mon=selDate.slice(0,7),filt={role:'',shift:''},plan=null,planInfo=null,rf=null,rt=null;
try{const u=sessionStorage.getItem('iat_user');if(u)me=DB.users.find(x=>x.id===u)||null}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const dim=(y,m)=>new Date(y,m,0).getDate();
const dow=dt=>new Date(dt+'T00:00:00').getDay();
const uid=()=>'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const isAdmin=()=>me&&me.role==='admin';
const dm=d=>`${d.slice(8)}/${d.slice(5,7)}`;
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}
const roleOf=w=>DB.roles.find(r=>r.id===w.role)||{name:'?',color:'#888',maxOff:0};
const shiftOf=w=>DB.shifts.find(s=>s.id===w.shift)||{name:'—',group:'day'};
const grp=w=>shiftOf(w).group;
const isSep=w=>!!roleOf(w).sep;
const active=()=>DB.workers.filter(w=>w.active!==false);
const key=(d,id)=>d+'|'+id;
function stOf(d,id,pl){const k=key(d,id);return (pl&&pl[k]&&pl[k].s)||(DB.att[k]&&DB.att[k].s)||(DB.pub[d]?'F':'N')}
function monthDates(mo){const[y,m]=mo.split('-').map(Number);return Array.from({length:dim(y,m)},(_,i)=>fmt(y,m,i+1))}
const quotaOf=w=>(w.quota===''||w.quota==null)?DB.quota:Number(w.quota);
const countSt=(mo,id,st)=>monthDates(mo).filter(d=>stOf(d,id)===st).length;
const offsOn=(d,pl)=>active().filter(w=>!isSep(w)&&stOf(d,w.id,pl)==='H');
/* ---------- rules ---------- */
const prefOf=w=>{const r=roleOf(w);return (grp(w)==='night'?r.prefNight:r.prefDay)||[]};
const prefTxt=a=>[1,2,3,4,5,6,0].filter(x=>a.includes(x)).map(x=>DN[x].slice(0,3)).join(', ');
function violationFor(w,d,pl){
 const r=roleOf(w),msgs=[];
 const oth=offsOn(d,pl).filter(x=>x.id!==w.id);
 if(r.maxOff>0){const same=oth.filter(x=>x.role===w.role&&(!r.perGroup||grp(x)===grp(w)));
  if(same.length>=r.maxOff)msgs.push(`Another ${r.name} is already off that day${r.perGroup?' (same day/night shift)':''}: ${same.map(x=>x.name).join(', ')}.`)}
 if(DB.maxOffPerGroup>0){const g=oth.filter(x=>grp(x)===grp(w));if(g.length>=DB.maxOffPerGroup)msgs.push(`Max people off in this shift period reached (${DB.maxOffPerGroup}).`)}
 if(DB.maxOffDay>0&&oth.length>=DB.maxOffDay)msgs.push(`Already ${oth.length} people off that day (max ${DB.maxOffDay}).`);
 return msgs;
}
function softFor(w,d){const p=prefOf(w);return p.length&&!p.includes(dow(d))?[`${roleOf(w).name}s on the ${grp(w)} shift are normally off on: ${prefTxt(p)}.`]:[]}
function monthViolations(mo){
 const out=[];
 monthDates(mo).forEach(d=>{
  const offs=offsOn(d);
  DB.roles.forEach(r=>{
   if(r.maxOff>0){
    const rs=offs.filter(w=>w.role===r.id);
    (r.perGroup?['day','night']:[null]).forEach(g=>{const l=rs.filter(w=>!g||grp(w)===g);
     if(l.length>r.maxOff)out.push({d,t:`${l.length} ${r.name}s off together${g?(g==='day'?' (day shift)':' (night shift)'):''}: ${l.map(x=>x.name).join(', ')}`})});
   }
  });
  if(DB.maxOffPerGroup>0)['day','night'].forEach(g=>{const l=offs.filter(w=>grp(w)===g);if(l.length>DB.maxOffPerGroup)out.push({d,t:`${l.length} people off in ${g} shift (limit ${DB.maxOffPerGroup})`})});
  if(DB.maxOffDay>0&&offs.length>DB.maxOffDay)out.push({d,t:`${offs.length} people off together (max ${DB.maxOffDay})`});
  offs.forEach(w=>{const sf=softFor(w,d);if(sf.length)out.push({d,t:`${w.name}: ${sf[0]}`,soft:true})});
 });
 active().filter(w=>!isSep(w)).forEach(w=>{const hs=monthDates(mo).filter(d=>stOf(d,w.id)==='H'),q=quotaOf(w);if(hs.length>q)out.push({d:hs[hs.length-1],t:`${w.name} has ${hs.length} days off this month (allowed ${q}) — tap one in the grid to remove it`})});
 return out;
}
function suggest(mo){
 const dates=monthDates(mo),n=dates.length,pl={},unres=[],relaxed=[],capBroke=[],gapBroke=[];
 const staff=active().filter(w=>!isSep(w));
 const pr=w=>{const r=roleOf(w);return (r.strict&&prefOf(w).length?2:0)+(r.maxOff>0?1:0)};
 const t0=todayS(),trimmed=[];
 staff.forEach(w=>{const hs=dates.filter(d=>stOf(d,w.id)==='H');let ex=hs.length-quotaOf(w);for(let i=hs.length-1;i>=0&&ex>0;i--){if(hs[i]>t0){pl[key(hs[i],w.id)]={s:'N'};ex--;if(!trimmed.includes(w.name))trimmed.push(w.name)}}});
 const kept=(w)=>dates.filter(d=>stOf(d,w.id,pl)==='H').length;
 const list=staff.map(w=>({w,need:quotaOf(w)-kept(w)})).filter(x=>x.need>0).sort((a,b)=>pr(b.w)-pr(a.w)||roleIdx(a.w)-roleIdx(b.w));
 const existing=staff.reduce((a,w)=>a+kept(w),0);
 const cap=DB.maxOffDay>0?DB.maxOffDay:Math.max(1,Math.ceil((existing+list.reduce((a,x)=>a+x.need,0))/n));
 const maxNeed=Math.max(0,...list.map(x=>x.need));
 const PASSES=[{pref:1,cap:1,gap:1},{pref:0,cap:1,gap:1},{pref:0,cap:0,gap:1},{pref:0,cap:0,gap:0}];
 const pick=(w,target,o,gapMin)=>{
  const pref=prefOf(w),r=roleOf(w);let best=null,bs=1e9;
  const own=[];dates.forEach((d,i)=>{if(stOf(d,w.id,pl)==='H')own.push(i)});
  dates.forEach((d,i)=>{
   if(stOf(d,w.id,pl)!=='N')return;
   if(violationFor(w,d,pl).length)return;
   const wd=dow(d);
   if(o.pref&&r.strict&&pref.length&&!pref.includes(wd))return;
   const offs=offsOn(d,pl);
   if(o.cap&&offs.length>=cap)return;
   if(o.gap&&own.some(j=>Math.abs(i-j)<gapMin))return;
   let sc=offs.filter(x=>grp(x)===grp(w)).length*10+offs.length*4+Math.abs(i+1-target);
   if(pref.length){if(!pref.includes(wd))sc+=25}else if(DB.pressureDays.includes(wd))sc+=15;
   own.forEach(j=>{const g=Math.abs(i-j);if(g<15)sc+=(15-g)*3});
   if(sc<bs){bs=sc;best=d}
  });
  return best;
 };
 for(let k=0;k<maxNeed;k++)list.forEach(({w,need})=>{
  if(k>=need)return;
  const target=Math.round(n/need*(k+0.5)),gapMin=Math.max(1,Math.min(DB.minGap||0,Math.floor((n-1)/need)));

  pl[key(d,w.id)]={s:'H'};
  const add=(a)=>{if(!a.includes(w.name))a.push(w.name)};
  if(used>=1&&roleOf(w).strict&&prefOf(w).length)add(relaxed);
  if(used>=2)add(capBroke);
  if(used>=3)add(gapBroke);
 });
 return{pl,unres,trimmed,count:Object.keys(pl).filter(k=>pl[k].s==='H').length,relaxed,capBroke,gapBroke,cap};
}

  const wage=Number(w.wage)||0;

 });

  :[...(who==='sep'?[['Hours',x=>x.hrs]]:[]),['Present',x=>x.c.W+x.c.L],['Late',x=>x.c.L],['Absent',x=>x.c.A],['Approved',x=>x.c.P],['Day off',x=>x.c.H],['Public hol.',x=>x.c.F],['Not marked',x=>x.c.N],...(adm?[['Daily wage',x=>x.wage],['Deduction AED',x=>x.ded]]:[])];
 const base=mode==='plan'?'Days-off schedule':'Attendance sheet';
 return{mode,who,dates,cols,off,adm,rowsT,title:new Date(y,m-1,1).toLocaleString('en',{month:'long',year:'numeric'}),sub:who==='sep'?'Drivers - '+base.toLowerCase():base};

function buildSheet(wb,D,name){
 const cnt=D.cols.length,n=D.dates.length;
 const ws=wb.addWorksheet(name.slice(0,31),{pageSetup:{paperSize:9,orientation:cnt>40?'landscape':'portrait',fitToPage:true,fitToWidth:1,fitToHeight:1,margins:{left:0.3,right:0.3,top:0.4,bottom:0.4,header:0.2,footer:0.2}}});
 const last=cnt+2,bd={style:'thin',color:{argb:'FF000000'}},border={top:bd,left:bd,bottom:bd,right:bd};
 const solid=h=>({type:'pattern',pattern:'solid',fgColor:{argb:'FF'+h}});
 ws.mergeCells(1,1,1,last+1);const t=ws.getCell(1,1);t.value=`IAT Trading — ${D.sub} — ${D.title}`;t.font={bold:true,size:14};
 ws.mergeCells(2,1,2,last+1);const lg=ws.getCell(2,1);lg.value=legendTxt(D.mode);lg.font={size:9,color:{argb:'FF555555'}};
 ws.getRow(4).height=95;

 hc(1,'Date','0F6CBD');D.cols.forEach((x,i)=>hc(2+i,x.w.name,roleOf(x.w).color.slice(1).toUpperCase()));hc(last,'People off','0F6CBD');hc(last+1,'Date','0F6CBD');
 D.dates.forEach((d,i)=>{

  D.cols.forEach((x,j)=>{const c=row.getCell(2+j),st=x.codes[i];c.value=cellTxt(x,i)||null;c.fill=solid(cellHex(x,st,i));c.border=border;c.font={size:8,bold:st!=='N',color:{argb:'FF'+(TXT[st]?TXT[st].map(v=>v.toString(16).padStart(2,'0')).join(''):'000000')}};c.alignment={horizontal:'center',vertical:'middle'}});
  const o=row.getCell(last);o.value=D.off[i]||null;o.border=border;o.font={bold:true,size:9};o.alignment={horizontal:'center'};
 });
 D.rowsT.forEach(([lb,f],k)=>{
  const row=ws.getRow(5+n+k);
  const a=row.getCell(1);a.value=lb;a.font={bold:true,size:9};a.fill=solid('EEF2F6');a.border=border;const a2=row.getCell(last+1);a2.value=lb;a2.font={bold:true,size:9};a2.fill=solid('EEF2F6');a2.border=border;
  D.cols.forEach((x,j)=>{const c=row.getCell(2+j),v=f(x);c.value=v||null;c.font={bold:true,size:8};c.fill=solid('F8FAFC');c.border=border;c.alignment={horizontal:'center'}});
  if(lb==='Deduction AED'){const c=row.getCell(last);c.value=D.cols.reduce((q,x)=>q+x.ded,0);c.font={bold:true,size:10};c.border=border;c.alignment={horizontal:'center'}}

 ws.getCell(sr,1).value='Prepared by: ______________';ws.getCell(sr,Math.min(8,last)).value='Approved by: ______________';ws.getCell(sr,Math.min(18,last)).value='Date: ___________';
 ws.getColumn(1).width=13;for(let i=0;i<cnt;i++)ws.getColumn(2+i).width=4.4;ws.getColumn(last).width=9;ws.getColumn(last+1).width=13;

function monthXLSXPlain(mode,only){

function pdfSheet(doc,D){
 const cnt=D.cols.length,n=D.dates.length,land=cnt>40;
 const PW=land?297:210,PH=land?210:297,M=8;
 doc.setFontSize(13);doc.setTextColor(20);doc.text(`IAT Trading - ${D.sub} - ${D.title}`,M,M+4);
 doc.setFontSize(6.5);doc.text(legendTxt(D.mode).replace(/·/g,'|'),M,M+8.5);
 const T=D.rowsT.length,headH=land?26:30,footH=14,top=M+11;
 const rh=Math.min(6.5,(PH-top-M-headH-footH)/(n+T));
 const fs=Math.min(8,Math.max(3.8,rh*1.55)),pad=Math.max(0.1,(rh-fs*0.41)/2);
 const dateW=land?16:15,offW=7,wkW=(PW-2*M-2*dateW-offW)/cnt;
 const head=[['Date',...D.cols.map(()=>''),'Off','Date']];
 const body=D.dates.map((d,i)=>[dayLabel(d),...D.cols.map(x=>cellTxt(x,i)),D.off[i]||'',dayLabel(d)]);
 D.rowsT.forEach(([lb,f])=>body.push([lb,...D.cols.map(x=>f(x)||''),'',lb]));
 const cs={0:{cellWidth:dateW,halign:'left'}};D.cols.forEach((_,i)=>cs[1+i]={cellWidth:wkW});cs[1+cnt]={cellWidth:offW};cs[2+cnt]={cellWidth:dateW,halign:'left'};
 doc.autoTable({head,body,startY:top,theme:'grid',margin:{left:M,right:M,top:M,bottom:M},
  styles:{fontSize:fs,cellPadding:{top:pad,bottom:pad,left:0.15,right:0.15},halign:'center',valign:'middle',lineWidth:0.15,lineColor:[0,0,0],overflow:'hidden',minCellHeight:rh,textColor:20},
  headStyles:{fillColor:[222,230,240],textColor:20,minCellHeight:headH,fontSize:fs,lineWidth:0.2,lineColor:[0,0,0]},columnStyles:cs,
  didParseCell(hk){
   if(hk.section!=='body')return;
   const ri=hk.row.index,ci=hk.column.index;
   if(ri<n){
    if(ci===0||ci===cnt+2){const d=D.dates[ri];hk.cell.styles.fontStyle='bold';hk.cell.styles.fillColor=hexRGB(dateHex(d,ri))}
    else if(ci===cnt+1){hk.cell.styles.fontStyle='bold';hk.cell.styles.fillColor=ri%2?[225,229,236]:[238,241,245]}
    else{const x=D.cols[ci-1],st=x.codes[ri];hk.cell.styles.fillColor=hexRGB(cellHex(x,st,ri));if(st!=='N'){hk.cell.styles.fontStyle='bold';if(TXT[st])hk.cell.styles.textColor=TXT[st]}}
   }else{hk.cell.styles.fillColor=[232,237,243];hk.cell.styles.fontStyle='bold'}
  },
  didDrawCell(hk){
   if(hk.section==='body'&&hk.row.index<n&&hk.column.index>=1&&hk.column.index<=cnt){
    const x=D.cols[hk.column.index-1],day=String(Number(D.dates[hk.row.index].slice(8))),has=!!cellTxt(x,hk.row.index);
    doc.setTextColor(has?110:170,has?110:170,has?110:170);
    if(has){doc.setFontSize(Math.max(2.4,fs*0.5));doc.text(day,hk.cell.x+0.25,hk.cell.y+Math.max(1,fs*0.17))}
    else{doc.setFontSize(Math.max(2.8,fs*0.85));doc.text(day,hk.cell.x+hk.cell.width/2,hk.cell.y+hk.cell.height/2+fs*0.12,{align:'center'})}
    doc.setTextColor(20);return;
   }
   if(hk.section!=='head'||hk.column.index<1||hk.column.index>cnt)return;
   const x=D.cols[hk.column.index-1];
   doc.setFillColor(...hex2rgb(roleOf(x.w).color));doc.rect(hk.cell.x,hk.cell.y,hk.cell.width,1.2,'F');
   doc.setFontSize(Math.min(fs,7));doc.setTextColor(20);
   let nm=x.w.name;const maxW=headH-4;while(nm.length>3&&doc.getTextWidth(nm)>maxW)nm=nm.slice(0,-1);
   doc.text(nm,hk.cell.x+hk.cell.width/2+doc.getFontSize()*0.125,hk.cell.y+hk.cell.height-1.5,{angle:90});
  }});
 let y=doc.lastAutoTable.finalY+5;
 if(D.adm&&D.mode==='att'){doc.setFontSize(8);doc.text(`Total deductions: ${D.cols.reduce((a,x)=>a+x.ded,0).toLocaleString()} AED`,M,y);y+=5}
 if(y>PH-M-6){doc.addPage();y=M+6}
 doc.setFontSize(8);doc.text('Prepared by: ____________________',M,y);doc.text('Approved by: ____________________',PW/2-20,y);doc.text('Date: ____________',PW-50,y);
}

 const rows=[['Date','Worker','Status','Note']];
 Object.keys(DB.att).sort().forEach(k=>{const[d,id]=k.split('|'),w=DB.workers.find(x=>x.id===id);if(w){const a=DB.att[k];rows.push([d,w.name,ST[a.s].l,a.n||''])}});
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Attendance');
 const js=JSON.stringify(DB),parts=[];for(let i=0;i<js.length;i+=30000)parts.push([js.slice(i,i+30000)]);
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(parts),'Config');
 XLSX.writeFile(wb,`iat_attendance_backup_${todayS()}.xlsx`);
}
async function importBackup(f){
 if(!f)return;const wb=XLSX.read(await f.arrayBuffer());const sh=wb.Sheets['Config'];if(!sh)return toast('Not a backup file from this app');
 try{const js=XLSX.utils.sheet_to_json(sh,{header:1}).map(r=>r[0]).join('');const x=JSON.parse(js);if(!confirm('Replace ALL current data with this backup?'))return;DB=Object.assign(clone(DEF),x);save();me=DB.users.find(u=>u.id===me.id)||DB.users[0];toast('Backup restored');render()}catch(e){toast('File is damaged')}
}
async function importOld(f){
 if(!f)return;const mo=$('#om').value;if(!mo)return toast('Pick the month first');
 const[y,m]=mo.split('-').map(Number);
 const wb=XLSX.read(await f.arrayBuffer());const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
 const hdr=rows[0]||[];const cols=[];let c=2;while(c<hdr.length&&String(hdr[c]).trim()){cols.push(c);c++}
 if(!cols.length)return toast('Could not read names from the first row');
 const typ=rows[1]||[];const map={work:'W',late:'L',absent:'A',holiday:'H','w/off':'H'};
 const idx={};
 cols.forEach(ci=>{const name=String(hdr[ci]).trim();
  const want=/driver/i.test(String(typ[ci]))?'driver':'worker';
  const rid=DB.roles.find(r=>r.id===want)?want:DB.roles[0].id;
  let w=DB.workers.find(x=>x.name.toLowerCase()===name.toLowerCase()&&x.role===rid);
  if(!w){w={id:uid(),name,role:rid,shift:DB.shifts[0].id,wage:'',quota:'',phone:'',active:true};DB.workers.push(w)}idx[ci]=w.id});
 let n=0;
 rows.slice(2).forEach(r=>{let d=null;for(let i=c;i<r.length;i++){const mm=String(r[i]).match(/(\d{1,2})-[A-Za-z]{3}/);if(mm){d=Number(mm[1]);break}}
  if(!d)return;const dt=fmt(y,m,d);
  cols.forEach(ci=>{const st=map[String(r[ci]).trim().toLowerCase()];if(st){DB.att[key(dt,idx[ci])]={s:st};n++}})});
 save();toast(`Imported ${cols.length} workers and ${n} records`);mon=mo;render();
}
/* ================= ONEDRIVE SYNC (Microsoft Graph) + JSON backup =================
   Put your Azure "Application (client) ID" below. Empty = local-only mode.
   The whole app data is kept in ONE JSON file on OneDrive: IAT-Attendance/attendance.json */
const OD={clientId:"",authority:"https://login.microsoftonline.com/common",path:"IAT-Attendance/attendance.json",pollMs:45000};
const ODON=!!OD.clientId;
const _renderLogin=renderLogin,_logout=logout,_vSet=vSet,_save=save;
const stab=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
let odApp=null,odAcct=null,odEtag=null,odBase=null,odBusy=false,odTimer=null,odMsg='',odAgain=false;
const GR='https://graph.microsoft.com/v1.0/me/drive/root:/'+OD.path;
function normDB(x){const d=Object.assign(clone(DEF),x||{});fixRoles(d);return d}
function odChip(t,bad){
 odMsg=t;let e=null;try{e=document.getElementById('odst')}catch(x){}
 if(!e){try{e=document.createElement('div');e.id='odst';e.onclick=()=>{if(ODON&&!odAcct)odConnect();else odSync(true)};e.style.cssText='position:fixed;left:8px;bottom:8px;z-index:50;font-size:12px;padding:4px 10px;border-radius:14px;background:#fff;border:1px solid #cbd5e1;box-shadow:0 1px 4px #0002;cursor:pointer';document.body.appendChild(e)}catch(x){return}}
 e.textContent='☁ '+t;e.style.color=bad?'#b91c1c':'#334155';
}
async function odToken(interactive){
 const req={scopes:['Files.ReadWrite'],account:odAcct};
 try{return (await odApp.acquireTokenSilent(req)).accessToken}
 catch(e){if(!interactive)throw e;return (await odApp.acquireTokenPopup(req)).accessToken}
}
async function odMeta(tok){
 const r=await fetch(GR,{headers:{Authorization:'Bearer '+tok}});
 if(r.status===404)return null;if(!r.ok)throw new Error('meta '+r.status);
 const j=await r.json();return{eTag:j.eTag}
}
async function odGet(tok){
 const r=await fetch(GR+':/content',{headers:{Authorization:'Bearer '+tok}});
 if(!r.ok)throw new Error('get '+r.status);return await r.json();
}
async function odPut(tok,body,etag){
 const h={Authorization:'Bearer '+tok,'Content-Type':'application/json'};if(etag)h['If-Match']=etag;
 const r=await fetch(GR+':/content',{method:'PUT',headers:h,body:JSON.stringify(body)});
 if(r.status===412)return{conflict:true};if(!r.ok)throw new Error('put '+r.status);
 const j=await r.json();return{eTag:j.eTag}
}
/* 3-way merge: keep every change made on this phone since the last sync, take everything else from OneDrive */
function odMerge(R,L,B){
 const out=Object.assign({},R);B=B||{};
 Object.keys(L).forEach(k=>{if(k==='att')return;if(!B||stab(L[k])!==stab(B[k]))out[k]=L[k]});
 const att=Object.assign({},R.att||{}),bA=B.att||{},lA=L.att||{};
 Object.keys(lA).forEach(k=>{if(stab(lA[k])!==stab(bA[k]))att[k]=lA[k]});
 Object.keys(bA).forEach(k=>{if(!lA[k])delete att[k]});
 out.att=att;return out;
}
const odPayload=()=>({app:'iat-attendance',version:2,saved:new Date().toISOString(),data:DB});
function odApply(nd){
 if(stab(nd)===stab(DB))return false;
 const meId=me&&me.id;DB=normDB(nd);
 if(meId){me=DB.users.find(u=>u.id===meId)||null}
 _save();return true;
}
async function odSync(manual){
 if(!ODON||!odAcct)return;
 if(odBusy){odAgain=true;return}
 odBusy=true;odChip('Saving…');
 try{
  let tok;try{tok=await odToken(false)}catch(e){tok=await odToken(!!manual)}
  let changed=false,done=false;
  for(let i=0;i<3&&!done;i++){
   const meta=await odMeta(tok);
   if(!meta){const p=await odPut(tok,odPayload(),null);if(p.conflict)continue;odEtag=p.eTag;odBase=clone(DB);done=true;break}
   if(meta.eTag!==odEtag){
    const rem=await odGet(tok),R=normDB(rem.data);
    const merged=odBase?odMerge(R,DB,odBase):R;
    if(odApply(merged))changed=true;
    odBase=clone(R);odEtag=meta.eTag;
   }
   if(stab(DB)!==stab(odBase)){
    const p=await odPut(tok,odPayload(),meta.eTag);
    if(p.conflict){odEtag=null;continue}
    odEtag=p.eTag;odBase=clone(DB);
   }
   done=true;
  }
  if(!done)throw new Error('conflict');
  odChip('Saved '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
  if(changed){if(me===null&&!isLoginScreen())logout();const a=document.activeElement;if(!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))render()}
 }catch(e){console.error(e);odChip(navigator.onLine===false?'Offline — will retry':'Sync problem — will retry',true)}
 odBusy=false;
 if(odAgain){odAgain=false;odSched(500)}
}
const isLoginScreen=()=>!!(document.querySelector&&document.querySelector('#login'));
function odSched(ms){clearTimeout(odTimer);odTimer=setTimeout(()=>odSync(),ms||2500)}
save=function(){_save();if(ODON&&odAcct)odSched()};
async function odConnect(){
 if(!odApp)return toast('OneDrive library not loaded — open the GitHub link with internet');
 try{
  const r=await odApp.loginPopup({scopes:['Files.ReadWrite']});odAcct=r.account;odApp.setActiveAccount(odAcct);
  odBase=null;odEtag=null;await odSync(true);
  if(me&&!DB.users.find(u=>u.id===me.id))me=null;
  render();
 }catch(e){console.error(e);toast('OneDrive sign-in was cancelled or blocked')}
}
function odDisconnect(){if(!confirm('Disconnect OneDrive on this phone? Data stays on the phone.'))return;try{odApp.logoutPopup({account:odAcct})}catch(e){}odAcct=null;odEtag=null;odBase=null;odChip('Not connected',true);render()}
function odInit(){
 if(!ODON)return;
 const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js';
 s.onload=()=>{
  try{
   odApp=new msal.PublicClientApplication({auth:{clientId:OD.clientId,authority:OD.authority,redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
   odAcct=odApp.getAllAccounts()[0]||null;
   if(odAcct){odApp.setActiveAccount(odAcct);odSync().then(()=>{if(me===null)renderLogin()});setInterval(()=>{if(document.visibilityState!=='hidden')odSync()},OD.pollMs);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')odSync()})}
   else{odChip('Not connected — tap to connect',true)}
   if(me===null)renderLogin();
  }catch(e){console.error(e);odChip('OneDrive unavailable here (needs the https link)',true)}
 };
 s.onerror=()=>odChip('OneDrive library not loaded',true);
 document.head.appendChild(s);
 window.addEventListener('online',()=>odSync());
}
renderLogin=function(){
 _renderLogin();
 if(!ODON)return;
 const b=document.querySelector('#login');if(!b)return;
 const d=document.createElement('div');d.className='row';d.style.marginTop='8px';
 d.innerHTML=odAcct?`<span class="leg" style="margin:0">☁ OneDrive: ${esc(odAcct.username||'connected')}</span>`:`<button class="b grn" onclick="odConnect()">Connect OneDrive first</button><span class="leg" style="margin:0">Needed once on a new phone, to load users and workers.</span>`;
 b.appendChild(d);
};
/* ----- JSON file backup (manual copy; works from any phone, even without sync) ----- */
function backupObj(){return odPayload()}
async function jsonSave(){
 if(!isAdmin())return toast('Manager only');
 const name=`iat-attendance-backup-${todayS()}.json`,blob=new Blob([JSON.stringify(backupObj(),null,1)],{type:'application/json'});
 try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
 dl(blob,name);toast('Saved '+name);
}
async function jsonLoad(f){
 if(!isAdmin())return toast('Manager only');if(!f)return;
 try{
  const x=JSON.parse(await f.text());const d=x&&x.data;if(!d||!Array.isArray(d.workers)||!d.att)return toast('Not a backup file from this app');
  if(!confirm(`Replace ALL current data with this backup (${d.workers.length} workers, saved ${String(x.saved||'').slice(0,10)})?`))return;
  const meId=me.id;DB=normDB(d);me=DB.users.find(u=>u.id===meId)||DB.users[0];
  save();toast('Backup loaded');render();
 }catch(e){toast('Could not read that file')}
}
vSet=function(){
 _vSet();
 const bk=[...document.querySelectorAll('#v .card')].find(c=>c.querySelector('h3')&&/^Backup/.test(c.querySelector('h3').textContent));
 if(!bk)return;
 const r=document.createElement('div');r.className='row';
 r.innerHTML=(ODON?(odAcct?`<span class="leg" style="margin:0">☁ OneDrive: ${esc(odAcct.username||'connected')} · file IAT-Attendance/attendance.json</span><button class="b" onclick="odSync(true)">Sync now</button><button class="b sec" onclick="odDisconnect()">Disconnect</button>`:`<button class="b grn" onclick="odConnect()">Connect OneDrive</button>`):`<span class="leg" style="margin:0">OneDrive sync is off: put the Azure client ID in the file (see the setup note).</span>`)
  +`<button class="b grn" onclick="jsonSave()">Save backup (JSON)</button><label class="b sec" style="cursor:pointer">Load backup (JSON)<input type="file" accept=".json,application/json" hidden onchange="jsonLoad(this.files[0]);this.value=''"></label>`;
 bk.insertBefore(r,bk.children[1]||null);
};

render();odInit();
</script>
